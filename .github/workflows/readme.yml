name: README
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly: links can break without a commit here
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Links answer and tables are well-formed
        run: python3 .github/scripts/check_readme.py profile/README.md
